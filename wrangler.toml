name = "f1hub"
compatibility_date = "2026-02-02"
pages_build_output_dir = "web"

# =========================================================
# CAMBIO DE ESTRATEGIA DE DEPLOY — leer antes de tocar nada
#
# El botón "Add binding" del dashboard de Cloudflare está roto a nivel
# de CUENTA (lo confirmamos: falla incluso en un proyecto de Pages
# recién creado, en múltiples navegadores y en modo incógnito). Hasta
# que Cloudflare lo resuelva por soporte, la salida es dejar de
# depender de esa pantalla por completo:
#
#   wrangler pages deploy SÍ lee los bindings de acá abajo — es un
#   camino distinto al de "push a GitHub y que Cloudflare build solo",
#   que es el que ignora este archivo.
#
# Esto significa que a partir de ahora el deploy es:
#   npx wrangler pages deploy web --project-name=f1hub
# en vez de (o además de) el push a GitHub. Ver README, sección
# "Deploy por CLI" para el paso a paso completo, incluyendo cómo evitar
# que las dos formas de deploy se pisen entre sí.
# =========================================================

[[d1_databases]]
binding = "F1_DB"
database_name = "f1hub-db"
database_id = "a72321ce-810f-4662-b3bd-8582206ea473"

[[kv_namespaces]]
binding = "F1_KV"
id = "43fbd7d481054fa0a623eebbf93e47db"

# ---- Secret para firmar la cookie de identidad anónima ----
# npx wrangler pages secret put IDENTITY_SECRET --project-name=f1hub
# (cualquier string largo y aleatorio sirve, por ejemplo: openssl rand -hex 32)

# ---- Variables opcionales ----
# OPENF1_TOKEN, GOOGLE_CLIENT_ID/SECRET, GITHUB_CLIENT_ID/SECRET,
# RESEND_API_KEY — todos opcionales, mismo mecanismo de secret.
