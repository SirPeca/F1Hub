name = "f1hub-cron"
main = "src/index.js"
compatibility_date = "2026-02-02"
compatibility_flags = ["nodejs_compat"]  # necesario para que funcione la librería web-push

# Corre cada 15 min: revisa si alguna sesión arranca en breve y notifica.
# Corre 1 vez por día (04:00 UTC): recalcula campeonatos históricos por piloto.
[triggers]
crons = ["*/15 * * * *", "0 4 * * *"]

# Mismos bindings que el proyecto de Pages — DEBEN apuntar a la MISMA
# base D1 y el MISMO namespace KV que f1hub (Pages), sino este Worker
# no va a ver ni las suscripciones push ni compartir el caché.
# [[d1_databases]]
# binding = "F1_DB"
# database_name = "f1hub-db"
# database_id = "MISMO_ID_QUE_EN_PAGES"
#
# [[kv_namespaces]]
# binding = "F1_KV"
# id = "MISMO_ID_QUE_EN_PAGES"

# Secrets necesarios (generados una sola vez, ver README de esta carpeta):
#   npx wrangler secret put VAPID_PUBLIC_KEY
#   npx wrangler secret put VAPID_PRIVATE_KEY
#   npx wrangler secret put VAPID_SUBJECT   (ej: mailto:tu@mail.com)
